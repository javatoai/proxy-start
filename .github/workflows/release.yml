name: Verify and release Proxy Start

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.1.11)
        required: true
        default: v0.1.11
        type: string

permissions:
  contents: read

concurrency:
  group: proxy-start-release-${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # go1.27.2 is the current stable patch used by the checked-in Windows
  # helper build and was verified against go.dev/dl on 2026-10-18.
  GO_VERSION: '1.27.2'
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'
  GOFLAGS: -mod=readonly
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.version.outputs.release }}
      ref: ${{ steps.version.outputs.ref }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate tag against VERSION
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic three-part version" >&2
            exit 1
          fi
          release=false
          tag=""
          ref="$GITHUB_REF"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" != "v$version" ]]; then
              echo "Release tag must be v$version, got $tag" >&2
              exit 1
            fi
            ref="$tag"
            release=true
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            if [[ "$tag" != "v$version" ]]; then
              echo "Release tag must be v$version, got $tag" >&2
              exit 1
            fi
            if ! git rev-parse "$tag^{commit}" >/dev/null 2>&1; then
              echo "workflow_dispatch requires an existing tag: $tag" >&2
              exit 1
            fi
            ref="$tag"
            release=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/heads/* ]]; then
            ref="$GITHUB_REF"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            ref="$GITHUB_REF"
          fi
          {
            echo "release=$release"
            echo "ref=$ref"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Test release verification gates
        shell: bash
        run: python3 -m unittest discover -s scripts -p 'test_release_verification.py' -v

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            platform: windows-x64
          - name: macOS arm64 and amd64
            runner: macos-14
            platform: macos
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Check Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          go_version="$(go version)"
          [[ "$go_version" == "go version go${GO_VERSION} "* ]] || {
            echo "Unexpected Go toolchain: $go_version" >&2
            exit 1
          }

      - name: Run Windows tests and console environment check
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'go test failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet failed' }
          $env:PROXY_START_CONSOLE_REAL = '1'
          $env:PROXY_START_CONSOLE_BYPASS_REAL = '1'
          go test ./internal/platform/console -run '^TestWindows(ChildEnvironment(Bypass)?Integration|ConsoleProxyBypassRoutingIntegration)$' -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Windows console environment or bypass routing test failed' }

      - name: Run native macOS tests
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          if ! go test ./...; then echo 'go test failed' >&2; exit 1; fi
          if ! go vet ./...; then echo 'go vet failed' >&2; exit 1; fi
          if ! PROXY_START_DARWIN_INTEGRATION=1 go test ./internal/platform/darwin -count=1; then
            echo 'Darwin integration test failed' >&2
            exit 1
          fi

      - name: Build Windows portable and source packages
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $output = "dist/release-$env:RELEASE_VERSION"
          ./scripts/pack.ps1 -OutputDir $output -GoExe go -SkipTests
          $staging = 'dist/windows-x64'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Get-ChildItem -LiteralPath $output -Filter '*.zip' -File | Copy-Item -Destination $staging
          Copy-Item -LiteralPath (Join-Path $output 'checksums.sha256') -Destination (Join-Path $staging 'ProxyStart-windows.checksums.sha256')
          $assets = @(Get-ChildItem -LiteralPath $staging -File)
          if ($assets.Count -ne 3) { throw "Expected three Windows release assets, got $($assets.Count)" }
          $checkBinary = Join-Path $output 'ProxyStart-windows-amd64/proxy-start.exe'
          $checkConfig = Join-Path $env:RUNNER_TEMP 'proxy-start-check-settings.json'
          $checkStdout = Join-Path $env:RUNNER_TEMP 'proxy-start-check.stdout.json'
          $checkStderr = Join-Path $env:RUNNER_TEMP 'proxy-start-check.stderr.txt'
          $checkProcess = Start-Process -FilePath $checkBinary -ArgumentList @('--check', '--config', ('"' + $checkConfig + '"')) -WindowStyle Hidden -RedirectStandardOutput $checkStdout -RedirectStandardError $checkStderr -PassThru
          if (-not $checkProcess.WaitForExit(15000)) { Stop-Process -Id $checkProcess.Id -Force; throw 'Windows --check timed out' }
          if ($checkProcess.ExitCode -ne 0) { throw ('Windows --check failed: ' + (Get-Content -LiteralPath $checkStderr -Raw)) }
          $checkOutput = Get-Content -LiteralPath $checkStdout -Raw
          $check = $checkOutput | ConvertFrom-Json
          if ($check.Version -ne $env:RELEASE_VERSION) { throw "Windows --check version $($check.Version) does not match $env:RELEASE_VERSION" }

      - name: Build macOS arm64 and amd64 app packages
        if: matrix.platform == 'macos'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          output="dist/release-${RELEASE_VERSION}-macos"
          command -v pwsh >/dev/null 2>&1
          pwsh -NoLogo -NoProfile -File scripts/pack-macos.ps1 -OutputDir "$output" -Version "$RELEASE_VERSION" -GoExe "$(command -v go)" -SkipTests
          staging='dist/macos'
          mkdir -p "$staging"
          find "$output" -maxdepth 1 -type f -name '*.zip' -exec cp {} "$staging/" \;
          cp "$output/checksums.sha256" "$staging/ProxyStart-macos.checksums.sha256"
          count="$(find "$staging" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$count" -eq 3
          native_arch="$(go env GOARCH)"
          app="$output/ProxyStart-macos-${native_arch}/Proxy Start.app"
          plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          test "$plist_version" = "$RELEASE_VERSION"
          "$app/Contents/MacOS/proxy-start" --check --config "$RUNNER_TEMP/proxy-start-smoke-settings.json" >/tmp/proxy-start-check.txt
          test -s /tmp/proxy-start-check.txt
          python3 - "$RELEASE_VERSION" /tmp/proxy-start-check.txt <<'PY'
          import json
          import pathlib
          import sys
          expected = sys.argv[1]
          payload = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          if payload.get('Version') != expected:
              raise SystemExit(f"--check version {payload.get('Version')!r} does not match {expected!r}")
          PY

      - name: Upload platform packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proxy-start-${{ matrix.platform }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/${{ matrix.platform }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Verify assets and publish GitHub Release
    needs: [version, build]
    if: needs.version.outputs.release == 'true' && github.repository == 'javatoai/proxy-start'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false

      - name: Download successful platform packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: proxy-start-*-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/release
          merge-multiple: true

      - name: Validate package set and hashes
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-release-assets.py --directory dist/release --version "$RELEASE_VERSION"

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['RELEASE_TAG']
          run = f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          heading = f"## {tag.removeprefix('v')}"
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          try:
              start = changelog.index(heading) + 1
          except ValueError:
              raise SystemExit(f'Missing changelog entry for {tag}')
          end = next((i for i in range(start, len(changelog)) if changelog[i].startswith('## ')), len(changelog))
          changes = '\n'.join(changelog[start:end]).strip()
          if not changes:
              raise SystemExit(f'Empty changelog entry for {tag}')
          notes = changes + '\n\n' + '\n'.join([
              '## 验证与平台范围', '',
              f'- Windows 控制台环境与本地 HTTP/SOCKS5 域名分流测试在 CI 执行；历史 HTTPS 代理验证见[验证记录](https://github.com/{repo}/blob/{tag}/docs/CONSOLE-VERIFICATION.md)。真实外网测试保留为显式启用。',
              f'- Windows / macOS 原生测试、构建和版本诊断：[本次 CI]({run})。',
              '- macOS 提供 Apple Silicon / Intel 包、Codex 原生 HTTP 代理和代理终端；按程序强制代理仅支持 Windows。',
              '- macOS 未完成 Developer ID 签名或公证，GUI、Keychain、Terminal 和真实 Codex 联网仍需 Mac 实机验收。',
              '- macOS CI 使用临时配置执行 `--check`，并验证进程启停与回收；不安装驱动或启动目标应用。', '',
          ])
          Path(os.environ['RUNNER_TEMP'], 'proxy-start-release-notes.md').write_text(notes, encoding='utf-8')
          PY

      - name: Create or reuse draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          NOTES_FILE: ${{ runner.temp }}/proxy-start-release-notes.md
        shell: bash
        run: |
          set -euo pipefail
          lookup_release_id() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | .id"
          }
          release_id="$(lookup_release_id)"
          if [[ -n "$release_id" ]]; then
            [[ "$release_id" =~ ^[0-9]+$ ]] || { echo 'Ambiguous release id' >&2; exit 1; }
            draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.draft')"
            test "$draft" = true || { echo "Release $RELEASE_TAG already published" >&2; exit 1; }
            gh release edit "$RELEASE_TAG" --title "Proxy Start $RELEASE_TAG" --notes-file "$NOTES_FILE"
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = {
              'tag_name': os.environ['RELEASE_TAG'],
              'name': f"Proxy Start {os.environ['RELEASE_TAG']}",
              'body': Path(os.environ['NOTES_FILE']).read_text(encoding='utf-8'),
              'draft': True,
          }
          Path(os.environ['RUNNER_TEMP'], 'proxy-start-release-request.json').write_text(json.dumps(payload, ensure_ascii=False), encoding='utf-8')
          PY
            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --method POST --input "$RUNNER_TEMP/proxy-start-release-request.json" --jq '.id')"
          fi
          [[ "$release_id" =~ ^[0-9]+$ ]] || { echo 'Missing release id' >&2; exit 1; }
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Upload verified assets to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/release/* --clobber

      - name: Verify remote release assets and digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "$RUNNER_TEMP/proxy-start-release.json"
          python3 scripts/verify-github-release.py \
            --directory dist/release \
            --release-json "$RUNNER_TEMP/proxy-start-release.json"

      - name: Publish release after asset upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
